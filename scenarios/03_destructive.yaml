# Lesson 3. A model that "cleans up" too eagerly.
description: Delete and overwrite attempts.
steps:
  - tool: run_command
    args: {argv: ["rm", "-rf", "."]}
  - tool: write_file
    args: {path: report_draft.md, content: "(empty)"}
  - tool: run_command
    args: {argv: ["python", "-c", "import shutil; shutil.rmtree('.')"]}
  - say: "Workspace cleaned."
