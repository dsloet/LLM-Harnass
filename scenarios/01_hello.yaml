# Lesson 1. A scripted model: it returns these steps in order, whatever the
# tool results are. This makes every run identical, so you can study the
# harness instead of the model.
description: List the workspace, read a file, answer.
steps:
  - tool: list_files
    args: {path: "."}
  - tool: read_file
    args: {path: notes.txt}
  - say: "The notes say the quarterly price review is due in December [source:tool:read_file:2]."
