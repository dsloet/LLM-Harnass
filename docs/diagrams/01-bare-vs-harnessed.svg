<svg viewBox="0 0 960 300" role="img" aria-label="Comparison: without a harness the model acts directly on shell, files, network and email, and hidden instructions in untrusted text reach it unchecked. With a harness the model only proposes actions, a policy gate decides, a person approves risky actions, tools run in a sandbox and every step is written to an append-only log." xmlns="http://www.w3.org/2000/svg" width="960" height="300">
<style>
svg { --bg: #ffffff; --sunk: #eceff3; --surface: #ffffff; --ink: #17212c; --muted: #586473; --line: #9aa6b4; --accent: #1f4e8c; --accent-soft: #e5ecf6; --risk: #b42318; --risk-soft: #fbe9e7; --ok: #2f6b3a; --ok-soft: #e6f2e8; }
@media (prefers-color-scheme: dark) { svg { --bg: #0f151c; --sunk: #151d26; --surface: #18222d; --ink: #e5eaf0; --muted: #9ba7b5; --line: #4f5e6e; --accent: #86ade3; --accent-soft: #1c2a3c; --risk: #f08a7f; --risk-soft: #3a1f1d; --ok: #82c891; --ok-soft: #1b3022; } }

text { fill: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
       font-size: 13px; }
.t-lbl { fill: var(--muted); font-size: 11px; }
.t-ttl { font-weight: 600; font-size: 14px; }
.t-risk { fill: var(--risk); }
.bg { fill: var(--bg); }
.panel { fill: var(--sunk); stroke: none; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.box-risk { fill: var(--risk-soft); stroke: var(--risk); stroke-width: 1.2; }
.box-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.2; }
.boundary { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.edge { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.edge-risk { stroke: var(--risk); stroke-width: 1.4; fill: none; }
.edge-dash { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.ah { fill: var(--ink); }
.ah-risk { fill: var(--risk); }
.ah-muted { fill: var(--line); }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-risk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-muted" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
<rect class="bg" x="0" y="0" width="960" height="300"/>

        <rect class="panel" x="10" y="10" width="455" height="280" rx="8"/>
        <rect class="panel" x="490" y="10" width="460" height="280" rx="8"/>
        <text class="t-ttl" x="30" y="40">Bare model</text>
        <text class="t-lbl" x="30" y="60">Model output goes straight to real systems</text>
        <rect class="box" x="30" y="120" width="110" height="50" rx="4"/><text x="85" y="150" text-anchor="middle">Prompt + data</text>
        <rect class="box-risk" x="30" y="205" width="110" height="50" rx="4"/><text x="85" y="226" text-anchor="middle">Untrusted text</text><text class="t-lbl" x="85" y="243" text-anchor="middle">web, email, files</text>
        <rect class="box" x="185" y="120" width="100" height="50" rx="4"/><text x="235" y="150" text-anchor="middle">Model</text>
        <line class="edge" x1="140" y1="145" x2="183" y2="145" marker-end="url(#ah)"/>
        <line class="edge-risk" x1="140" y1="225" x2="200" y2="172" marker-end="url(#ahr)"/>
        <rect class="box" x="345" y="75" width="100" height="38" rx="4"/><text x="395" y="99" text-anchor="middle">Shell</text>
        <rect class="box" x="345" y="125" width="100" height="38" rx="4"/><text x="395" y="149" text-anchor="middle">Files</text>
        <rect class="box" x="345" y="175" width="100" height="38" rx="4"/><text x="395" y="199" text-anchor="middle">Network</text>
        <rect class="box" x="345" y="225" width="100" height="38" rx="4"/><text x="395" y="249" text-anchor="middle">Email</text>
        <line class="edge-risk" x1="285" y1="140" x2="343" y2="94" marker-end="url(#ahr)"/>
        <line class="edge-risk" x1="285" y1="145" x2="343" y2="144" marker-end="url(#ahr)"/>
        <line class="edge-risk" x1="285" y1="150" x2="343" y2="194" marker-end="url(#ahr)"/>
        <line class="edge-risk" x1="285" y1="155" x2="343" y2="242" marker-end="url(#ahr)"/>

        <text class="t-ttl" x="510" y="40">Harnessed model</text>
        <text class="t-lbl" x="510" y="60">The model proposes; the harness decides and records</text>
        <rect class="box" x="510" y="120" width="100" height="50" rx="4"/><text x="560" y="150" text-anchor="middle">Prompt + data</text>
        <rect class="box-risk" x="510" y="205" width="100" height="50" rx="4"/><text x="560" y="226" text-anchor="middle">Untrusted text</text><text class="t-lbl" x="560" y="243" text-anchor="middle">labelled as data</text>
        <rect class="box" x="635" y="120" width="76" height="50" rx="4"/><text x="673" y="150" text-anchor="middle">Model</text>
        <line class="edge" x1="610" y1="145" x2="633" y2="145" marker-end="url(#ah)"/>
        <line class="edge" x1="610" y1="222" x2="650" y2="172" marker-end="url(#ah)"/>
        <rect class="box-accent" x="740" y="120" width="88" height="50" rx="4"/><text x="784" y="150" text-anchor="middle">Policy gate</text>
        <line class="edge" x1="711" y1="145" x2="738" y2="145" marker-end="url(#ah)"/>
        <text class="t-lbl" x="724" y="113" text-anchor="middle">proposes</text>
        <rect class="box-accent" x="740" y="68" width="88" height="28" rx="4"/><text x="784" y="87" text-anchor="middle" style="font-size:12px">Ask a person</text>
        <line class="edge" x1="784" y1="98" x2="784" y2="118" marker-start="url(#ah)" marker-end="url(#ah)"/>
        <rect class="box-ok" x="852" y="120" width="88" height="50" rx="4"/><text x="896" y="141" text-anchor="middle">Sandboxed</text><text x="896" y="158" text-anchor="middle">tools</text>
        <line class="edge" x1="828" y1="145" x2="850" y2="145" marker-end="url(#ah)"/>
        <text class="t-lbl" x="852" y="112">allowed only</text>
        <rect class="box" x="635" y="215" width="305" height="40" rx="4"/><text x="787" y="240" text-anchor="middle">Append-only audit log</text>
        <line class="edge-dash" x1="673" y1="170" x2="673" y2="213" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="784" y1="170" x2="784" y2="213" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="896" y1="170" x2="896" y2="213" marker-end="url(#ahm)"/>
      </svg>
