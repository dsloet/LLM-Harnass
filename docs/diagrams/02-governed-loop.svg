<svg viewBox="0 0 960 310" role="img" aria-label="One cycle of a governed agent loop: assemble labelled context, the model proposes an action, a policy check denies, allows or asks a person, allowed actions run in a sandbox with least privilege, and the result returns to the context marked as data. Denied actions are blocked and logged. Every step writes to an event log." xmlns="http://www.w3.org/2000/svg" width="960" height="310">
<style>
svg { --bg: #ffffff; --sunk: #eceff3; --surface: #ffffff; --ink: #17212c; --muted: #586473; --line: #9aa6b4; --accent: #1f4e8c; --accent-soft: #e5ecf6; --risk: #b42318; --risk-soft: #fbe9e7; --ok: #2f6b3a; --ok-soft: #e6f2e8; }
@media (prefers-color-scheme: dark) { svg { --bg: #0f151c; --sunk: #151d26; --surface: #18222d; --ink: #e5eaf0; --muted: #9ba7b5; --line: #4f5e6e; --accent: #86ade3; --accent-soft: #1c2a3c; --risk: #f08a7f; --risk-soft: #3a1f1d; --ok: #82c891; --ok-soft: #1b3022; } }

text { fill: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
       font-size: 13px; }
.t-lbl { fill: var(--muted); font-size: 11px; }
.t-ttl { font-weight: 600; font-size: 14px; }
.t-risk { fill: var(--risk); }
.bg { fill: var(--bg); }
.panel { fill: var(--sunk); stroke: none; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.box-risk { fill: var(--risk-soft); stroke: var(--risk); stroke-width: 1.2; }
.box-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.2; }
.boundary { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.edge { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.edge-risk { stroke: var(--risk); stroke-width: 1.4; fill: none; }
.edge-dash { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.ah { fill: var(--ink); }
.ah-risk { fill: var(--risk); }
.ah-muted { fill: var(--line); }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-risk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-muted" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
<rect class="bg" x="0" y="0" width="960" height="310"/>

        <rect class="box-accent" x="390" y="16" width="160" height="44" rx="4"/><text x="470" y="43" text-anchor="middle">Ask a person</text>
        <rect class="box-risk" x="610" y="16" width="160" height="44" rx="4"/><text x="690" y="43" text-anchor="middle">Blocked and logged</text>

        <rect class="box" x="20" y="110" width="160" height="60" rx="4"/><text x="100" y="135" text-anchor="middle">Assemble context</text><text class="t-lbl" x="100" y="153" text-anchor="middle">sources labelled by trust</text>
        <rect class="box" x="205" y="110" width="160" height="60" rx="4"/><text x="285" y="135" text-anchor="middle">Model proposes</text><text class="t-lbl" x="285" y="153" text-anchor="middle">an action</text>
        <rect class="box-accent" x="390" y="110" width="160" height="60" rx="4"/><text x="470" y="135" text-anchor="middle">Policy check</text><text class="t-lbl" x="470" y="153" text-anchor="middle">deny, allow or ask</text>
        <rect class="box-ok" x="575" y="110" width="160" height="60" rx="4"/><text x="655" y="135" text-anchor="middle">Run in sandbox</text><text class="t-lbl" x="655" y="153" text-anchor="middle">least privilege, time limit</text>
        <rect class="box" x="760" y="110" width="160" height="60" rx="4"/><text x="840" y="135" text-anchor="middle">Return result</text><text class="t-lbl" x="840" y="153" text-anchor="middle">marked as data</text>

        <line class="edge" x1="180" y1="140" x2="203" y2="140" marker-end="url(#ah)"/>
        <line class="edge" x1="365" y1="140" x2="388" y2="140" marker-end="url(#ah)"/>
        <line class="edge" x1="550" y1="140" x2="573" y2="140" marker-end="url(#ah)"/>
        <line class="edge" x1="735" y1="140" x2="758" y2="140" marker-end="url(#ah)"/>

        <line class="edge" x1="440" y1="108" x2="440" y2="62" marker-end="url(#ah)"/>
        <text class="t-lbl" x="434" y="90" text-anchor="end">ask</text>
        <line class="edge" x1="500" y1="62" x2="500" y2="108" marker-end="url(#ah)"/>
        <text class="t-lbl" x="506" y="90">approved</text>
        <line class="edge-risk" x1="540" y1="108" x2="630" y2="62" marker-end="url(#ahr)"/>
        <text class="t-lbl t-risk" x="596" y="96">deny</text>

        <polyline class="edge" points="840,170 840,212 100,212 100,172" marker-end="url(#ah)"/>
        <text class="t-lbl" x="378" y="205" text-anchor="middle">next turn</text>

        <rect class="box" x="20" y="250" width="900" height="40" rx="4"/><text x="470" y="275" text-anchor="middle">Event log: full input, output, decision, approver and time for every step</text>
        <line class="edge-dash" x1="55" y1="170" x2="55" y2="248" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="285" y1="170" x2="285" y2="248" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="470" y1="170" x2="470" y2="248" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="655" y1="170" x2="655" y2="248" marker-end="url(#ahm)"/>
        <line class="edge-dash" x1="885" y1="170" x2="885" y2="248" marker-end="url(#ahm)"/>
      </svg>
